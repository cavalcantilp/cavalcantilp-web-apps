<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Calculateur Investissement Simple</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <style>
    body { max-width: 900px; margin: 0 auto; padding: 16px; background: var(--bg); color: var(--text-main); overflow-x: hidden; }

    .header { margin-bottom: 16px; text-align: center; }
    .header h1 { font-size: 1.4em; font-weight: 800; margin-bottom: 6px; color: var(--text-main); }
    .header p { color: var(--text-sub); font-size: 0.9rem; }

    /* Bandeau de résultat figé en haut (comme une ligne de total gelée dans un tableur) */
    .results-sticky {
      position: sticky; top: 0; z-index: 40;
      background: var(--bg);
      margin: 0 -16px 18px -16px;
      padding: 10px 16px 14px 16px;
      box-shadow: 0 8px 12px -6px rgba(0,0,0,0.4);
    }
    .results-card {
      background: var(--card-bg); border: 1px solid var(--accent); border-radius: 16px;
      padding: 14px 16px;
    }
    .results-card h2 { margin: 0 0 4px 0; color: var(--text-sub); font-size: 0.8em; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; }
    .results-total { font-size: 1.7em; font-weight: 800; color: var(--accent); }
    .breakdown-list { margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
    .breakdown-row { display: flex; justify-content: space-between; font-size: 0.85em; color: var(--text-sub); }
    .breakdown-row span:last-child { color: var(--text-main); font-weight: 600; }

    fieldset.invest-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 16px; padding: 12px; margin-bottom: 12px; width: 100%; min-width: 0; }
    .invest-card-header { display: flex; justify-content: space-between; align-items: center; }
    .invest-card-header legend { font-weight: 700; color: var(--accent); font-size: 0.9em; padding: 0 4px; }
    .remove-btn { background: transparent; border: 1px solid var(--border); color: var(--negative); border-radius: 8px; width: 26px; height: 26px; font-size: 0.85em; cursor: pointer; line-height: 1; }
    .remove-btn:active { background: rgba(248,113,113,0.15); }

    .input-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 10px; margin-top: 8px; width: 100%; }
    .full-width { grid-column: 1 / -1; }
    label { display: block; font-weight: 600; font-size: 0.78em; margin-bottom: 4px; color: var(--text-sub); }
    input[type="text"], input[type="number"] {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; box-sizing: border-box;
      font-size: 0.9em; height: 36px; background: var(--input-bg); color: var(--text-main); outline: none; transition: all 0.2s ease;
    }
    input[type="text"]:focus, input[type="number"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }
    input[type="range"] { width: 100%; padding: 0; box-sizing: border-box; margin: 5px 0; accent-color: var(--accent); }
    .flex-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; flex-wrap: wrap; gap: 5px; }
    .highlight { color: var(--accent); font-weight: bold; }

    .invest-result { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 0.92em; color: var(--text-sub); }
    .invest-result strong { color: var(--positive); font-size: 1.05em; }

    .add-btn {
      width: 100%; padding: 12px; border: 2px dashed var(--border); border-radius: 14px;
      background: transparent; color: var(--accent); font-weight: 700; font-size: 0.95em;
      cursor: pointer; margin-top: 4px; margin-bottom: 20px; transition: all 0.2s ease;
    }
    .add-btn:active { background: rgba(56, 189, 248, 0.1); border-color: var(--accent); }

    .empty-state { text-align: center; color: var(--text-sub); font-size: 0.9em; padding: 20px 0; }
  </style>
</head>
<body ontouchstart="">

  <div class="top-bar">
    <a href="/" class="back-link" data-i18n="back">← Accueil</a>
    <div class="lang-selector">
      <select id="langSelect" onchange="changeLang(this.value)">
        <option value="fr">FR</option>
        <option value="pt">PT</option>
        <option value="es">ES</option>
        <option value="en">EN</option>
        <option value="it">IT</option>
      </select>
    </div>
  </div>

  <div class="header">
    <h1 data-i18n="title">📈 Calculateur Investissement Simple</h1>
    <p data-i18n="subtitle">Intérêts composés — ajoutez autant d'investissements que vous voulez</p>
  </div>

  <div class="results-sticky">
    <div class="results-card">
      <h2 data-i18n="total_label">Capital total estimé</h2>
      <div class="results-total"><span id="totalResultat">0 €</span></div>
      <div class="breakdown-list" id="breakdownList" style="display:none;"></div>
    </div>
  </div>

  <div id="investList"></div>
  <button type="button" class="add-btn" onclick="addInvestment()">+ <span data-i18n="add_button">Ajouter un investissement</span></button>

  <script>
    let currentLang = 'fr';
    let investments = [];
    let nextId = 1;

    const translations = {
      fr: {
        back: "← Accueil",
        title: "📈 Calculateur Investissement Simple",
        subtitle: "Intérêts composés — ajoutez autant d'investissements que vous voulez",
        total_label: "Capital total estimé",
        invest_label: "Investissement",
        apport_label: "Apport (€)",
        taux_label: "Taux de gain (%/an)",
        duree_label: "Durée",
        ans_suffix: "ans",
        result_prefix: "Argent après",
        add_button: "Ajouter un investissement",
        remove_label: "Supprimer",
        empty_state: "Aucun investissement pour le moment. Cliquez sur + pour commencer."
      },
      pt: {
        back: "← Início",
        title: "📈 Calculadora de Investimento Simples",
        subtitle: "Juros compostos — adicione quantos investimentos quiser",
        total_label: "Capital total estimado",
        invest_label: "Investimento",
        apport_label: "Entrada (€)",
        taux_label: "Taxa de ganho (%/ano)",
        duree_label: "Duração",
        ans_suffix: "anos",
        result_prefix: "Dinheiro após",
        add_button: "Adicionar um investimento",
        remove_label: "Remover",
        empty_state: "Nenhum investimento no momento. Clique em + para começar."
      },
      es: {
        back: "← Inicio",
        title: "📈 Calculadora de Inversión Simple",
        subtitle: "Interés compuesto — añade tantas inversiones como quieras",
        total_label: "Capital total estimado",
        invest_label: "Inversión",
        apport_label: "Aporte (€)",
        taux_label: "Tasa de rendimiento (%/año)",
        duree_label: "Duración",
        ans_suffix: "años",
        result_prefix: "Dinero después de",
        add_button: "Añadir una inversión",
        remove_label: "Eliminar",
        empty_state: "Ninguna inversión por ahora. Haz clic en + para empezar."
      },
      en: {
        back: "← Home",
        title: "📈 Simple Investment Calculator",
        subtitle: "Compound interest — add as many investments as you like",
        total_label: "Estimated total capital",
        invest_label: "Investment",
        apport_label: "Contribution (€)",
        taux_label: "Growth rate (%/year)",
        duree_label: "Duration",
        ans_suffix: "years",
        result_prefix: "Money after",
        add_button: "Add an investment",
        remove_label: "Remove",
        empty_state: "No investments yet. Click + to get started."
      },
      it: {
        back: "← Home",
        title: "📈 Calcolatore Investimento Semplice",
        subtitle: "Interesse composto — aggiungi tutti gli investimenti che vuoi",
        total_label: "Capitale totale stimato",
        invest_label: "Investimento",
        apport_label: "Contributo (€)",
        taux_label: "Tasso di rendimento (%/anno)",
        duree_label: "Durata",
        ans_suffix: "anni",
        result_prefix: "Denaro dopo",
        add_button: "Aggiungi un investimento",
        remove_label: "Rimuovi",
        empty_state: "Nessun investimento al momento. Clicca su + per iniziare."
      }
    };

    const formatNumber = (num) => Math.round(num).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
    const parseFormattedValue = (str) => parseFloat(str.toString().replace(/\s/g, '').replace(',', '.')) || 0;

    function t() { return translations[currentLang] || translations.fr; }

    function changeLang(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key] !== undefined) el.innerText = translations[lang][key];
      });
      document.getElementById('langSelect').value = lang;
      localStorage.setItem('preferred_lang_invest', lang);
      renderAll();
    }

    function formatEuroInput(el) {
      let cursorPosition = el.selectionStart;
      let originalLength = el.value.length;
      let unformatted = el.value.replace(/\s/g, '');
      if (unformatted !== '') el.value = unformatted.replace(/\B(?=(\d{3})+(?!\d))/g, " ");
      cursorPosition += (el.value.length - originalLength);
      el.setSelectionRange(cursorPosition, cursorPosition);
    }

    function addInvestment(apport, taux, duree) {
      investments.push({
        id: nextId++,
        apport: apport !== undefined ? apport : 10000,
        taux: taux !== undefined ? taux : 5,
        duree: duree !== undefined ? duree : 10
      });
      renderAll();
    }

    function removeInvestment(id) {
      investments = investments.filter(i => i.id !== id);
      renderAll();
    }

    function renderAll() {
      const tt = t();
      const container = document.getElementById('investList');

      if (investments.length === 0) {
        container.innerHTML = `<div class="empty-state">${tt.empty_state}</div>`;
        document.getElementById('totalResultat').innerText = "0 €";
        document.getElementById('breakdownList').style.display = 'none';
        saveState();
        return;
      }

      container.innerHTML = investments.map((inv, idx) => `
        <fieldset class="invest-card" data-id="${inv.id}">
          <div class="invest-card-header">
            <legend>${tt.invest_label} ${idx + 1}</legend>
            ${investments.length > 1 ? `<button type="button" class="remove-btn" onclick="removeInvestment(${inv.id})" title="${tt.remove_label}">✕</button>` : ''}
          </div>
          <div class="input-grid">
            <div>
              <label>${tt.apport_label}</label>
              <input type="text" class="euro-input" data-field="apport" value="${formatNumber(inv.apport)}" inputmode="numeric">
            </div>
            <div>
              <label>${tt.taux_label}</label>
              <input type="number" data-field="taux" value="${inv.taux}" step="0.1">
            </div>
            <div class="full-width">
              <div class="flex-label">
                <label style="margin:0;">${tt.duree_label}</label>
                <span class="highlight" data-field="dureeDisplay">${inv.duree} ${tt.ans_suffix}</span>
              </div>
              <input type="range" data-field="duree" min="0" max="50" step="1" value="${inv.duree}">
            </div>
          </div>
          <div class="invest-result">${tt.result_prefix} <span data-field="dureeEcho">${inv.duree}</span> ${tt.ans_suffix} : <strong data-field="resultat">0 €</strong></div>
        </fieldset>
      `).join('');

      updateResults();
    }

    function updateResults() {
      const tt = t();
      let total = 0;

      investments.forEach(inv => {
        const montant = inv.apport * Math.pow(1 + inv.taux / 100, inv.duree);
        total += montant;
        const card = document.querySelector(`.invest-card[data-id="${inv.id}"]`);
        if (card) {
          const resEl = card.querySelector('[data-field="resultat"]');
          const echoEl = card.querySelector('[data-field="dureeEcho"]');
          if (resEl) resEl.innerText = formatNumber(montant) + ' €';
          if (echoEl) echoEl.innerText = inv.duree;
        }
      });

      document.getElementById('totalResultat').innerText = formatNumber(total) + ' €';

      const breakdownEl = document.getElementById('breakdownList');
      if (investments.length > 1) {
        breakdownEl.style.display = 'flex';
        breakdownEl.innerHTML = investments.map((inv, idx) => {
          const montant = inv.apport * Math.pow(1 + inv.taux / 100, inv.duree);
          return `<div class="breakdown-row"><span>${tt.invest_label} ${idx + 1}</span><span>${formatNumber(montant)} €</span></div>`;
        }).join('');
      } else {
        breakdownEl.style.display = 'none';
      }

      saveState();
    }

    document.getElementById('investList').addEventListener('input', (e) => {
      const card = e.target.closest('.invest-card');
      if (!card) return;
      const id = parseInt(card.dataset.id, 10);
      const inv = investments.find(i => i.id === id);
      if (!inv) return;
      const field = e.target.dataset.field;

      if (field === 'apport') {
        formatEuroInput(e.target);
        inv.apport = parseFormattedValue(e.target.value);
      } else if (field === 'taux') {
        inv.taux = parseFloat(e.target.value) || 0;
      } else if (field === 'duree') {
        inv.duree = parseInt(e.target.value, 10) || 0;
        const dispEl = card.querySelector('[data-field="dureeDisplay"]');
        if (dispEl) dispEl.innerText = inv.duree + ' ' + t().ans_suffix;
      }

      updateResults();
    });

    function saveState() {
      try {
        localStorage.setItem('investSimpleStateV1', JSON.stringify({ investments, nextId }));
      } catch (e) {}
    }

    function loadState() {
      try {
        const saved = JSON.parse(localStorage.getItem('investSimpleStateV1'));
        if (!saved || !Array.isArray(saved.investments)) return false;
        investments = saved.investments;
        nextId = saved.nextId || (investments.reduce((m, i) => Math.max(m, i.id), 0) + 1);
        return true;
      } catch (e) { return false; }
    }

    if (!loadState()) {
      addInvestment(10000, 5, 10);
    } else {
      renderAll();
    }

    const detectLang = () => {
      const nav = navigator.language.toLowerCase();
      return ['pt', 'es', 'en', 'it'].find(l => nav.startsWith(l)) || 'fr';
    };
    const savedLang = localStorage.getItem('preferred_lang_invest') || detectLang();
    changeLang(savedLang);
  </script>
</body>
</html>
