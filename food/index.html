<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Comparateur d'Aliments</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --input-bg: #334155;
      --border: #475569;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }

    .app-card { background: var(--card-bg); width: 100%; max-width: 480px; padding: 24px; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); border: 1px solid var(--border); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .back-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    
    .lang-selector select, select.app-select {
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      outline: none;
      font-size: 0.88rem;
      width: 100%;
    }
    .lang-selector select {
      background: transparent;
      color: var(--text-sub);
      padding: 3px 6px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      width: auto;
    }

    .header { margin-bottom: 20px; text-align: center; }
    .header h1 { font-size: 1.5rem; font-weight: 700; }
    .header p { color: var(--text-sub); font-size: 0.875rem; margin-top: 4px; }

    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }

    .form-group { margin-bottom: 14px; }
    label { font-size: 0.78rem; font-weight: 600; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 6px; }

    input[type="number"] { width: 100%; padding: 8px 12px; background-color: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); font-size: 0.9rem; outline: none; -webkit-appearance: none; }

    .chart-container { position: relative; width: 100%; max-width: 360px; margin: 10px auto 20px auto; }

    .comparison-container { display: flex; flex-direction: column; gap: 14px; }
    
    .food-card { 
      background: rgba(255, 255, 255, 0.03); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      padding: 14px; 
      border-top-width: 4px; 
      transition: all 0.2s ease;
    }
    .food-card.reference { background: rgba(56, 189, 248, 0.05); }

    .food-header { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
    .food-header select { flex: 1; font-weight: 600; }
    .badge { font-size: 0.65rem; background: var(--accent); color: var(--bg); padding: 4px 8px; border-radius: 6px; font-weight: 800; text-transform: uppercase; white-space: nowrap; }

    .macro-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-top: 8px; }
    .macro-card { background: rgba(0, 0, 0, 0.2); padding: 8px 2px; border-radius: 8px; text-align: center; }
    .macro-title { font-size: 0.6rem; color: var(--text-sub); text-transform: uppercase; }
    .macro-value { font-size: 0.82rem; font-weight: 800; color: var(--text-main); margin: 2px 0; }

    .equiv-box {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(255, 255, 255, 0.1);
      font-size: 0.78rem;
      color: var(--text-main);
      font-weight: 500;
      text-align: center;
      line-height: 1.35;
    }
    .equiv-box strong { font-weight: 700; color: var(--accent); }
    .equiv-box.is-ref { color: var(--text-sub); font-style: italic; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="top-bar">
      <a href="/" class="back-link" data-i18n="back">← Accueil</a>
      <div class="lang-selector">
        <select id="langSelect" onchange="changeLang(this.value)">
          <option value="fr">FR</option>
          <option value="pt">PT</option>
        </select>
      </div>
    </div>

    <div class="header">
      <h1 data-i18n="title">Comparateur d'Aliments</h1>
      <p data-i18n="subtitle">Analyse nutritionnelle comparative</p>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="categorySelect" data-i18n="category">Catégorie</label>
        <select id="categorySelect" class="app-select" onchange="onCategoryChange()"></select>
      </div>
      <div class="form-group">
        <label for="portionWeight" data-i18n="mass">Masse (g)</label>
        <input type="number" id="portionWeight" value="100" min="1" max="5000" oninput="calculate()">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="referenceSelect" data-i18n="ref_food">Aliment de référence</label>
        <select id="referenceSelect" class="app-select" onchange="calculate()"></select>
      </div>
      <div class="form-group">
        <label for="paramSelect" data-i18n="param_comp">Paramètre cible</label>
        <select id="paramSelect" class="app-select" onchange="calculate()">
          <option value="kcal" data-i18n="lbl_kcal">Calories</option>
          <option value="p" data-i18n="lbl_prot">Protéines</option>
          <option value="f" data-i18n="lbl_fat">Lipides</option>
          <option value="c" data-i18n="lbl_carb">Glucides</option>
          <option value="fib" data-i18n="lbl_fibers">Fibres</option>
        </select>
      </div>
    </div>

    <!-- Le Bar Graph est placé ICI, au-dessus des cartes -->
    <div class="chart-container">
      <canvas id="compareChart"></canvas>
    </div>

    <!-- Conteneur des 5 cartes avec menus déroulants intégrés -->
    <div id="cardsContainer" class="comparison-container"></div>
  </div>

  <script>
    const database = {
      starchy: {
        fr: "Féculents & Céréales",
        pt: "Amidos e Cereais",
        suggested: ["rice_white", "pasta", "potato"],
        items: [
          { id: "rice_white", name: { fr: "Riz blanc (cuit)", pt: "Arroz branco (cozido)" }, kcal: 130, p: 2.7, f: 0.3, c: 28, fib: 0.4 },
          { id: "pasta", name: { fr: "Pâtes (cuites)", pt: "Massa (cozida)" }, kcal: 131, p: 5.0, f: 1.1, c: 25, fib: 1.8 },
          { id: "potato", name: { fr: "Pomme de terre (cuite)", pt: "Batata (cozida)" }, kcal: 87, p: 1.9, f: 0.1, c: 20, fib: 1.8 },
          { id: "rice_basmati", name: { fr: "Riz Basmati (cuit)", pt: "Arroz Basmati (cozido)" }, kcal: 121, p: 3.5, f: 0.4, c: 25, fib: 1.0 },
          { id: "sweet_potato", name: { fr: "Patate douce (cuite)", pt: "Batata doce (cozida)" }, kcal: 86, p: 1.6, f: 0.1, c: 20, fib: 3.0 },
          { id: "oats", name: { fr: "Flocons d'avoine", pt: "Aveia em flocos" }, kcal: 379, p: 13.2, f: 6.7, c: 57.7, fib: 10.6 },
          { id: "quinoa", name: { fr: "Quinoa (cuit)", pt: "Quinoa (cozida)" }, kcal: 120, p: 4.4, f: 1.9, c: 21.3, fib: 2.8 },
          { id: "bread_whole", name: { fr: "Pain complet", pt: "Pão integral" }, kcal: 247, p: 13, f: 3.4, c: 41, fib: 7.0 }
        ]
      },
      meat: {
        fr: "Viandes & Volailles",
        pt: "Carnes e Aves",
        suggested: ["chicken_breast", "beef_5", "turkey"],
        items: [
          { id: "chicken_breast", name: { fr: "Poulet (Blanc)", pt: "Frango (Peito)" }, kcal: 165, p: 31, f: 3.6, c: 0, fib: 0 },
          { id: "beef_5", name: { fr: "Bœuf 5% MG", pt: "Carne de vaca 5% gordura" }, kcal: 125, p: 21, f: 4.5, c: 0, fib: 0 },
          { id: "turkey", name: { fr: "Dinde (Filet)", pt: "Peru (Filete)" }, kcal: 135, p: 30, f: 1, c: 0, fib: 0 },
          { id: "beef_15", name: { fr: "Bœuf 15% MG", pt: "Carne de vaca 15% gordura" }, kcal: 215, p: 19, f: 15, c: 0, fib: 0 },
          { id: "pork_loin", name: { fr: "Filet de Porc", pt: "Lombo de Porco" }, kcal: 143, p: 26, f: 3.5, c: 0, fib: 0 }
        ]
      },
      fish: {
        fr: "Poissons & Œufs",
        pt: "Peixes e Ovos",
        suggested: ["salmon", "cod", "egg"],
        items: [
          { id: "salmon", name: { fr: "Saumon", pt: "Salmão" }, kcal: 206, p: 22, f: 12, c: 0, fib: 0 },
          { id: "cod", name: { fr: "Cabillaud", pt: "Bacalhau fresco" }, kcal: 82, p: 18, f: 0.7, c: 0, fib: 0 },
          { id: "egg", name: { fr: "Œuf entier", pt: "Ovo inteiro" }, kcal: 155, p: 13, f: 11, c: 1.1, fib: 0 },
          { id: "tuna_canned", name: { fr: "Thon au naturel", pt: "Atum em água" }, kcal: 116, p: 26, f: 1, c: 0, fib: 0 }
        ]
      }
    };

    const palette = [
      "#f59e0b", // Card 1: Jaune
      "#34d399", // Card 2: Vert
      "#f43f5e", // Card 3: Rouge
      "#a855f7", // Card 4: Violet
      "#fb923c"  // Card 5: Orange
    ];
    const refColor = "#38bdf8"; // Bleu pour la référence

    const translations = {
      fr: {
        back: "← Accueil",
        title: "Comparateur d'Aliments",
        subtitle: "Analyse nutritionnelle comparative",
        category: "Catégorie",
        mass: "Masse (g)",
        ref_food: "Référence",
        param_comp: "Paramètre cible",
        none: "-- Aucun --",
        ref_badge: "Réf",
        lbl_kcal: "Calories",
        lbl_prot: "Protéines",
        lbl_fat: "Lipides",
        lbl_carb: "Glucides",
        lbl_fibers: "Fibres",
        param_names: { kcal: "calories", p: "protéines", f: "lipides", c: "glucides", fib: "fibres" },
        equiv_ref: "Base de référence",
        equiv_template: "de {food} ont la même quantité de {param} que {mass}g de {refFood}"
      },
      pt: {
        back: "← Início",
        title: "Comparador de Alimentos",
        subtitle: "Análise nutricional comparativa",
        category: "Categoria",
        mass: "Massa (g)",
        ref_food: "Referência",
        param_comp: "Parâmetro alvo",
        none: "-- Nenhum --",
        ref_badge: "Ref",
        lbl_kcal: "Calorias",
        lbl_prot: "Proteínas",
        lbl_fat: "Gorduras",
        lbl_carb: "Carboidratos",
        lbl_fibers: "Fibras",
        param_names: { kcal: "calorias", p: "proteínas", f: "gorduras", c: "carboidratos", fib: "fibras" },
        equiv_ref: "Base de referência",
        equiv_template: "de {food} têm a mesma quantidade de {param} que {mass}g de {refFood}"
      }
    };

    let currentLang = 'fr';
    let chartInstance = null;
    let cardSelections = ["", "", "", "", ""];

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });
      document.getElementById('langSelect').value = lang;
      populateCategories();
      calculate();
    }

    function changeLang(lang) { setLanguage(lang); }

    function populateCategories() {
      const catSelect = document.getElementById('categorySelect');
      const selectedCat = catSelect.value || 'starchy';
      catSelect.innerHTML = '';
      
      Object.keys(database).forEach(catKey => {
        const opt = document.createElement('option');
        opt.value = catKey;
        opt.innerText = database[catKey][currentLang];
        catSelect.appendChild(opt);
      });
      catSelect.value = selectedCat;
      populateFoods();
    }

    function populateFoods() {
      const catKey = document.getElementById('categorySelect').value;
      const refSelect = document.getElementById('referenceSelect');
      
      refSelect.innerHTML = '';
      database[catKey].items.forEach(food => {
        const optRef = document.createElement('option');
        optRef.value = food.id;
        optRef.innerText = food.name[currentLang];
        refSelect.appendChild(optRef);
      });

      // 3 premiers suggérés, 4 et 5 vides
      cardSelections = [
        database[catKey].suggested[0] || "",
        database[catKey].suggested[1] || "",
        database[catKey].suggested[2] || "",
        "",
        ""
      ];

      refSelect.value = database[catKey].suggested[0];
    }

    function onCategoryChange() {
      populateFoods();
      calculate();
    }

    function updateCardSelection(index, val) {
      cardSelections[index] = val;
      calculate();
    }

    function calculate() {
      const catKey = document.getElementById('categorySelect').value;
      const refId = document.getElementById('referenceSelect').value;
      const targetParam = document.getElementById('paramSelect').value;
      const mass = parseFloat(document.getElementById('portionWeight').value) || 0;
      const ratio = mass / 100;
      const t = translations[currentLang];

      const allItems = database[catKey].items;
      const refFood = allItems.find(item => item.id === refId) || allItems[0];

      const container = document.getElementById('cardsContainer');
      container.innerHTML = '';

      const chartLabels = [];
      const chartData = [];
      const chartColors = [];

      cardSelections.forEach((foodId, idx) => {
        if (!foodId) return;
        const food = allItems.find(item => item.id === foodId);
        if (!food) return;

        const isRef = food.id === refFood.id;
        const cardColor = isRef ? refColor : palette[idx];

        const kcal = Math.round(food.kcal * ratio);
        const p = (food.p * ratio).toFixed(1);
        const f = (food.f * ratio).toFixed(1);
        const c = (food.c * ratio).toFixed(1);
        const fib = (food.fib * ratio).toFixed(1);

        let equivMassText = "";
        if (isRef) {
          equivMassText = `<div class="equiv-box is-ref">${t.equiv_ref} (${mass}g)</div>`;
        } else {
          const valPer100 = food[targetParam];
          const refTargetVal = refFood[targetParam] * ratio;
          if (valPer100 > 0) {
            const neededGrams = Math.round((refTargetVal / valPer100) * 100);
            const text = t.equiv_template
              .replace('{food}', food.name[currentLang])
              .replace('{param}', t.param_names[targetParam])
              .replace('{mass}', mass)
              .replace('{refFood}', refFood.name[currentLang]);

            equivMassText = `<div class="equiv-box">⚖️ <strong style="color:${cardColor}">${neededGrams}g</strong> ${text}</div>`;
          } else {
            equivMassText = `<div class="equiv-box is-ref">N/A</div>`;
          }
        }

        // Options pour le select de chaque carte
        let optionsHTML = `<option value="">${t.none}</option>`;
        allItems.forEach(item => {
          optionsHTML += `<option value="${item.id}" ${item.id === foodId ? 'selected' : ''}>${item.name[currentLang]}</option>`;
        });

        const card = document.createElement('div');
        card.className = `food-card ${isRef ? 'reference' : ''}`;
        card.style.borderTopColor = cardColor;

        card.innerHTML = `
          <div class="food-header">
            <select class="app-select" onchange="updateCardSelection(${idx}, this.value)">
              ${optionsHTML}
            </select>
            ${isRef ? `<span class="badge" style="background:${refColor}">${t.ref_badge}</span>` : ''}
          </div>
          <div class="macro-grid">
            <div class="macro-card" style="${targetParam === 'kcal' ? 'border: 1px solid ' + cardColor : ''}">
              <div class="macro-title">${t.lbl_kcal.substring(0,4)}</div>
              <div class="macro-value">${kcal}</div>
            </div>
            <div class="macro-card" style="${targetParam === 'p' ? 'border: 1px solid ' + cardColor : ''}">
              <div class="macro-title">${t.lbl_prot.substring(0,4)}</div>
              <div class="macro-value">${p}g</div>
            </div>
            <div class="macro-card" style="${targetParam === 'f' ? 'border: 1px solid ' + cardColor : ''}">
              <div class="macro-title">${t.lbl_fat.substring(0,4)}</div>
              <div class="macro-value">${f}g</div>
            </div>
            <div class="macro-card" style="${targetParam === 'c' ? 'border: 1px solid ' + cardColor : ''}">
              <div class="macro-title">${t.lbl_carb.substring(0,4)}</div>
              <div class="macro-value">${c}g</div>
            </div>
            <div class="macro-card" style="${targetParam === 'fib' ? 'border: 1px solid ' + cardColor : ''}">
              <div class="macro-title">${t.lbl_fibers.substring(0,4)}</div>
              <div class="macro-value">${fib}g</div>
            </div>
          </div>
          ${equivMassText}
        `;

        container.appendChild(card);

        chartLabels.push(food.name[currentLang]);
        chartData.push(parseFloat((food[targetParam] * ratio).toFixed(1)));
        chartColors.push(cardColor);
      });

      // Rendu des slots vides pour les cartes 4/5 non choisies
      cardSelections.forEach((foodId, idx) => {
        if (!foodId) {
          let optionsHTML = `<option value="">${t.none}</option>`;
          allItems.forEach(item => {
            optionsHTML += `<option value="${item.id}">${item.name[currentLang]}</option>`;
          });

          const card = document.createElement('div');
          card.className = "food-card";
          card.style.borderTopColor = palette[idx];
          card.style.opacity = "0.7";
          card.innerHTML = `
            <div class="food-header">
              <select class="app-select" onchange="updateCardSelection(${idx}, this.value)">
                ${optionsHTML}
              </select>
            </div>
          `;
          container.appendChild(card);
        }
      });

      updateChart(chartLabels, chartData, chartColors, t['lbl_' + (targetParam === 'kcal' ? 'kcal' : (targetParam === 'p' ? 'prot' : (targetParam === 'f' ? 'fat' : (targetParam === 'c' ? 'carb' : 'fibers'))))]);
    }

    function updateChart(labels, data, colors, paramLabel) {
      if (typeof Chart === 'undefined') return;
      const canvas = document.getElementById('compareChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{ label: paramLabel, data: data, backgroundColor: colors, borderRadius: 6 }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: { legend: { display: false } },
          scales: {
            x: { ticks: { color: '#94a3b8', font: { size: 10 } }, grid: { display: false } },
            y: { ticks: { color: '#94a3b8' }, grid: { color: 'rgba(255, 255, 255, 0.05)' } }
          }
        }
      });
    }

    const savedLang = localStorage.getItem('preferred_lang') || (navigator.language.startsWith('pt') ? 'pt' : 'fr');
    setLanguage(savedLang);
  </script>
</body>
</html>
