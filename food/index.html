<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0f172a">
  <title>Cible Nutritionnelle</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --input-bg: #334155;
      --border: #475569;
      --green: #34d399;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }

    .app-card { background: var(--card-bg); width: 100%; max-width: 480px; padding: 24px; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); border: 1px solid var(--border); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .back-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    
    .lang-selector select, select.app-select {
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      outline: none;
      font-size: 0.9rem;
      width: 100%;
    }
    .lang-selector select { background: transparent; color: var(--text-sub); padding: 3px 6px; border-radius: 6px; font-size: 0.75rem; width: auto; }

    .header { margin-bottom: 20px; text-align: center; }
    .header h1 { font-size: 1.4rem; font-weight: 700; }
    .header p { color: var(--text-sub); font-size: 0.85rem; margin-top: 4px; }

    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }

    .form-group { margin-bottom: 14px; }
    label { font-size: 0.75rem; font-weight: 600; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.05em; display: block; margin-bottom: 6px; }

    input[type="number"] { width: 100%; padding: 10px 12px; background-color: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); font-size: 1rem; font-weight: 700; outline: none; -webkit-appearance: none; }

    .target-banner { 
      background: rgba(56, 189, 248, 0.08); 
      border: 1px solid rgba(56, 189, 248, 0.25); 
      padding: 12px; 
      border-radius: 14px; 
      text-align: center; 
      margin: 16px 0; 
    }
    .target-banner .val { font-size: 1.25rem; font-weight: 800; color: var(--accent); }

    .results-list { display: flex; flex-direction: column; gap: 12px; }
    .equiv-card { 
      background: rgba(255, 255, 255, 0.03); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      padding: 14px; 
    }

    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .food-name { font-weight: 700; font-size: 0.95rem; }
    .portion-badge { background: var(--green); color: #0f172a; padding: 4px 12px; border-radius: 20px; font-weight: 800; font-size: 0.95rem; }

    .macro-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: rgba(0,0,0,0.25); padding: 8px; border-radius: 10px; text-align: center; }
    .m-item { font-size: 0.6rem; color: var(--text-sub); text-transform: uppercase; }
    .m-item strong { display: block; font-size: 0.8rem; color: var(--text-main); margin-top: 2px; }
    .m-item.highlight strong { color: var(--accent); }

    .custom-section {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="top-bar">
      <a href="/" class="back-link" data-i18n="back">← Accueil</a>
      <div class="lang-selector">
        <select id="langSelect" onchange="changeLang(this.value)">
          <option value="fr">FR</option>
          <option value="pt">PT</option>
        </select>
      </div>
    </div>

    <div class="header">
      <h1 data-i18n="title">Cible Nutritionnelle</h1>
      <p data-i18n="subtitle">Portions et contreparties</p>
    </div>

    <div class="form-group">
      <label for="categorySelect" data-i18n="category">Catégorie d'aliments</label>
      <select id="categorySelect" class="app-select" onchange="onCategoryChange()"></select>
    </div>

    <div class="row">
      <div class="form-group" style="flex: 1.2;">
        <label for="targetMacro" data-i18n="target_macro">Paramètre visé</label>
        <select id="targetMacro" class="app-select" onchange="calculate()">
          <option value="c" data-i18n="lbl_carb">Glucides</option>
          <option value="p" data-i18n="lbl_prot">Protéines</option>
          <option value="f" data-i18n="lbl_fat">Lipides</option>
          <option value="fib" data-i18n="lbl_fibers">Fibres</option>
          <option value="kcal" data-i18n="lbl_kcal">Calories</option>
        </select>
      </div>
      <div class="form-group" style="flex: 1;">
        <label for="targetValueInput" data-i18n="target_qty">Quantité visée</label>
        <input type="number" id="targetValueInput" value="50" min="1" oninput="calculate()">
      </div>
    </div>

    <div class="target-banner">
      <div class="val" id="summaryBanner">50g de Glucides</div>
    </div>

    <!-- 10 Sugestões Principais -->
    <div id="suggestedList" class="results-list"></div>

    <!-- 2 Menus Suspensos (Listes Déroulantes) -->
    <div class="custom-section">
      <div class="row">
        <div class="form-group">
          <label for="customSelect1" data-i18n="custom_1">Choix 1 (Optionnel)</label>
          <select id="customSelect1" class="app-select" onchange="calculate()"></select>
        </div>
        <div class="form-group">
          <label for="customSelect2" data-i18n="custom_2">Choix 2 (Optionnel)</label>
          <select id="customSelect2" class="app-select" onchange="calculate()"></select>
        </div>
      </div>
      <div id="customList" class="results-list" style="margin-top: 10px;"></div>
    </div>

  </div>

  <script>
    let database = {};

    const translations = {
      fr: {
        back: "← Accueil",
        title: "Cible Nutritionnelle",
        subtitle: "Portions et contreparties",
        category: "Catégorie d'aliments",
        target_macro: "Paramètre visé",
        target_qty: "Quantité visée",
        custom_1: "Option 1",
        custom_2: "Option 2",
        none: "-- Aucun --",
        lbl_kcal: "Calories",
        lbl_prot: "Protéines",
        lbl_fat: "Lipides",
        lbl_carb: "Glucides",
        lbl_fibers: "Fibres"
      },
      pt: {
        back: "← Início",
        title: "Meta Nutricional",
        subtitle: "Porções e contrapartidas",
        category: "Categoria de alimentos",
        target_macro: "Parâmetro alvo",
        target_qty: "Quantidade alvo",
        custom_1: "Opção 1",
        custom_2: "Opção 2",
        none: "-- Nenhum --",
        lbl_kcal: "Calorias",
        lbl_prot: "Proteínas",
        lbl_fat: "Gorduras",
        lbl_carb: "Carboidratos",
        lbl_fibers: "Fibras"
      }
    };

    let currentLang = 'fr';

    async function loadFoodsData() {
      try {
        const response = await fetch('foods.json');
        database = await response.json();
        const savedLang = localStorage.getItem('preferred_lang') || (navigator.language.startsWith('pt') ? 'pt' : 'fr');
        setLanguage(savedLang);
      } catch (err) {
        console.error("Impossible de charger foods.json:", err);
      }
    }

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });
      document.getElementById('langSelect').value = lang;
      localStorage.setItem('preferred_lang', lang);
      populateCategories();
      calculate();
    }

    function changeLang(lang) { setLanguage(lang); }

    function populateCategories() {
      const catSelect = document.getElementById('categorySelect');
      const selectedCat = catSelect.value || Object.keys(database)[0];
      catSelect.innerHTML = '';
      
      Object.keys(database).forEach(catKey => {
        const opt = document.createElement('option');
        opt.value = catKey;
        opt.innerText = database[catKey][currentLang];
        catSelect.appendChild(opt);
      });
      catSelect.value = selectedCat;
      populateDropdowns();
    }

    function populateDropdowns() {
      const catKey = document.getElementById('categorySelect').value;
      if (!database[catKey]) return;

      const items = database[catKey].items;
      const t = translations[currentLang];

      const c1 = document.getElementById('customSelect1');
      const c2 = document.getElementById('customSelect2');

      const v1 = c1.value;
      const v2 = c2.value;

      c1.innerHTML = `<option value="">${t.none}</option>`;
      c2.innerHTML = `<option value="">${t.none}</option>`;

      items.forEach(food => {
        const opt1 = document.createElement('option');
        opt1.value = food.id;
        opt1.innerText = food.name[currentLang];
        c1.appendChild(opt1);

        const opt2 = document.createElement('option');
        opt2.value = food.id;
        opt2.innerText = food.name[currentLang];
        c2.appendChild(opt2);
      });

      c1.value = v1;
      c2.value = v2;
    }

    function onCategoryChange() {
      populateDropdowns();
      calculate();
    }

    function createCard(food, targetMacro, targetVal, t) {
      const macroPer100 = food[targetMacro] || 0;
      if (macroPer100 <= 0) return null;

      const neededGrams = Math.round((targetVal / macroPer100) * 100);
      const ratio = neededGrams / 100;

      const kcal = Math.round(food.kcal * ratio);
      const p = (food.p * ratio).toFixed(1);
      const f = (food.f * ratio).toFixed(1);
      const c = (food.c * ratio).toFixed(1);
      const fib = ((food.fib || 0) * ratio).toFixed(1);

      const card = document.createElement('div');
      card.className = 'equiv-card';
      card.innerHTML = `
        <div class="card-top">
          <span class="food-name">${food.name[currentLang]}</span>
          <span class="portion-badge">${neededGrams}g</span>
        </div>
        <div class="macro-grid">
          <div class="m-item ${targetMacro === 'kcal' ? 'highlight' : ''}">${t.lbl_kcal.substring(0,4)}<strong>${kcal}</strong></div>
          <div class="m-item ${targetMacro === 'p' ? 'highlight' : ''}">${t.lbl_prot.substring(0,4)}<strong>${p}g</strong></div>
          <div class="m-item ${targetMacro === 'f' ? 'highlight' : ''}">${t.lbl_fat.substring(0,4)}<strong>${f}g</strong></div>
          <div class="m-item ${targetMacro === 'c' ? 'highlight' : ''}">${t.lbl_carb.substring(0,4)}<strong>${c}g</strong></div>
          <div class="m-item ${targetMacro === 'fib' ? 'highlight' : ''}">${t.lbl_fibers.substring(0,4)}<strong>${fib}g</strong></div>
        </div>
      `;
      return card;
    }

    function calculate() {
      const catKey = document.getElementById('categorySelect').value;
      if (!database[catKey]) return;

      const targetMacro = document.getElementById('targetMacro').value;
      const targetVal = parseFloat(document.getElementById('targetValueInput').value) || 0;
      const t = translations[currentLang];

      const macroName = t['lbl_' + (targetMacro === 'c' ? 'carb' : (targetMacro === 'p' ? 'prot' : (targetMacro === 'f' ? 'fat' : (targetMacro === 'fib' ? 'fibers' : 'kcal'))))];
      const unit = targetMacro === 'kcal' ? 'kcal' : 'g';
      document.getElementById('summaryBanner').innerText = `Objectif : ${targetVal}${unit} de ${macroName}`;

      const suggestedContainer = document.getElementById('suggestedList');
      suggestedContainer.innerHTML = '';

      const items = database[catKey].items;

      // 1. Mostrar até 10 sugestões principais que contenham o parâmetro visado
      const validItems = items.filter(food => (food[targetMacro] || 0) > 0);
      const top10 = validItems.slice(0, 10);

      top10.forEach(food => {
        const card = createCard(food, targetMacro, targetVal, t);
        if (card) suggestedContainer.appendChild(card);
      });

      // 2. Renderizar escolhas adicionais das listes déroulantes
      const customContainer = document.getElementById('customList');
      customContainer.innerHTML = '';

      const val1 = document.getElementById('customSelect1').value;
      const val2 = document.getElementById('customSelect2').value;

      [val1, val2].forEach(id => {
        if (id) {
          const food = items.find(item => item.id === id);
          if (food) {
            const card = createCard(food, targetMacro, targetVal, t);
            if (card) customContainer.appendChild(card);
          }
        }
      });
    }

    loadFoodsData();
  </script>
</body>
</html>
