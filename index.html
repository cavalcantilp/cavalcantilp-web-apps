<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur Calories</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --input-bg: #334155;
      --border: #475569;
      --warning: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 420px;
      padding: 24px;
      border-radius: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
    }

    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    .header p {
      color: var(--text-sub);
      font-size: 0.875rem;
      margin-top: 4px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-sub);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select {
      width: 100%;
      padding: 12px 14px;
      background-color: var(--input-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
      -webkit-appearance: none;
    }

    input:focus, select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group {
      flex: 1;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 8px;
      background-color: var(--accent);
      color: #0f172a;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
    }

    button:active {
      transform: scale(0.98);
      background-color: var(--accent-hover);
    }

    .result-box {
      margin-top: 20px;
      padding: 16px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 16px;
      text-align: center;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .result-box.active {
      display: block;
    }

    .result-title {
      font-size: 0.8rem;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .result-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--accent);
      margin: 4px 0;
    }

    .result-sub {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .warning-text {
      color: var(--warning);
      font-size: 0.75rem;
      margin-top: 8px;
      line-height: 1.2;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="header">
      <h1>Objectif Calories</h1>
      <p>Calculateur sur-mesure</p>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="height">Taille (cm)</label>
        <input type="number" id="height" value="178">
      </div>
      <div class="form-group">
        <label for="weight">Poids (kg)</label>
        <input type="number" id="weight" value="90">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="age">Âge</label>
        <input type="number" id="age" value="30">
      </div>
      <div class="form-group">
        <label for="gender">Sexe</label>
        <select id="gender">
          <option value="male">Homme</option>
          <option value="female">Femme</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="activity">Niveau d'activité</label>
      <select id="activity">
        <option value="1.2">Sédentaire (bureau)</option>
        <option value="1.375" selected>Léger (1-3x / semaine)</option>
        <option value="1.55">Modéré (3-5x / semaine)</option>
        <option value="1.725">Très actif (6-7x / semaine)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="goal">Rythme de perte souhaité</label>
      <select id="goal">
        <option value="0.25">0,25 kg / semaine (Très facile)</option>
        <option value="0.5" selected>0,50 kg / semaine (Recommandé)</option>
        <option value="0.75">0,75 kg / semaine (Soutenu)</option>
        <option value="1">1,00 kg / semaine (Intense)</option>
        <option value="1.5">1,50 kg / semaine (Agressif)</option>
      </select>
    </div>

    <button onclick="calc()">Calculer l'objectif</button>

    <div class="result-box" id="resultBox">
      <div class="result-title">Apport quotidien cible</div>
      <div class="result-value" id="targetVal">0 kcal</div>
      <div class="result-sub" id="deficitVal">Déficit : 0 kcal/jour</div>
      <div class="result-sub" id="tdeeVal">Maintien : 0 kcal/jour</div>
      <div class="warning-text" id="warningVal"></div>
    </div>
  </div>

  <script>
    function calc() {
      const h = parseFloat(document.getElementById('height').value);
      const w = parseFloat(document.getElementById('weight').value);
      const a = parseFloat(document.getElementById('age').value);
      const gender = document.getElementById('gender').value;
      const act = parseFloat(document.getElementById('activity').value);
      const kgPerWeek = parseFloat(document.getElementById('goal').value);

      if (!h || !w || !a) return;

      // Métabolisme de base (BMR)
      const bmr = (10 * w) + (6.25 * h) - (5 * a) + (gender === 'male' ? 5 : -161);
      
      // Dépense énergétique totale (TDEE)
      const tdee = bmr * act;

      // 1 kg de graisse = 7700 kcal -> déficit journalier nécessaire
      const dailyDeficit = (kgPerWeek * 7700) / 7;
      let target = tdee - dailyDeficit;

      // Sécurité : Avertissement si le calcul descend sous le BMR
      let warningMsg = "";
      if (target < bmr) {
        warningMsg = "⚠️ Attention : cet objectif passe en dessous de votre métabolisme de base (" + Math.round(bmr) + " kcal). Cela peut être difficile à maintenir.";
      }

      document.getElementById('targetVal').innerText = Math.round(target) + " kcal";
      document.getElementById('deficitVal').innerText = "Déficit : -" + Math.round(dailyDeficit) + " kcal/jour";
      document.getElementById('tdeeVal').innerText = "Maintien : " + Math.round(tdee) + " kcal/jour";
      document.getElementById('warningVal').innerText = warningMsg;
      
      document.getElementById('resultBox').classList.add('active');
    }
  </script>
</body>
</html>
