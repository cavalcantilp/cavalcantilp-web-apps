name: Update CAC 40 dividends

# Rafraîchit data/cac40-dividends.json une fois par jour. Les dividendes
# changent rarement : un passage quotidien suffit largement et reste très
# en dessous du quota du plan gratuit (40 appels sur 800 crédits/jour).
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: # permet aussi de lancer la synchro à la main

# Nécessaire pour que l'Action puisse committer le JSON mis à jour.
permissions:
  contents: write

concurrency:
  group: update-dividends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch dividends
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: node scripts/fetch-dividends.mjs

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/cac40-dividends.json
          # generated_at change à chaque exécution : on ne committe que si les
          # données elles-mêmes ont bougé, pour ne pas polluer l'historique.
          if git diff --cached --quiet; then
            echo 'Aucun changement de données.'
            exit 0
          fi
          if git diff --cached -I'"generated_at"' --quiet; then
            echo 'Seul generated_at a changé — rien à committer.'
            git reset
            exit 0
          fi
          git commit -m 'chore: update CAC 40 dividend data'
          git push
