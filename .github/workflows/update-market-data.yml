name: Update CAC 40 market data

# Rafraîchit dividendes et cours une fois par jour. Les dividendes
# changent rarement : un passage quotidien suffit largement et reste très
# en dessous du quota du plan gratuit (80 appels sur 800 crédits/jour).
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch: # permet aussi de lancer la synchro à la main

# Nécessaire pour que l'Action puisse committer le JSON mis à jour.
permissions:
  contents: write

concurrency:
  group: update-dividends
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Dividendes et cours sont deux jeux de données indépendants : l'un peut
      # être hors du plan souscrit, ou échouer temporairement, sans que cela
      # doive priver l'app de l'autre. On les laisse donc se terminer tous les
      # deux, on committe ce qui a été récupéré, et on échoue à la fin.
      - name: Fetch dividends
        id: dividends
        continue-on-error: true
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: node scripts/fetch-dividends.mjs

      - name: Fetch prices
        id: prices
        continue-on-error: true
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: node scripts/fetch-prices.mjs

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/cac40-dividends.json data/prices
          # generated_at change à chaque exécution : on ne committe que si les
          # données elles-mêmes ont bougé, pour ne pas polluer l'historique.
          if git diff --cached --quiet; then
            echo 'Aucun changement de données.'
            exit 0
          fi
          if git diff --cached -I'"generated_at"' --quiet; then
            echo 'Seul generated_at a changé — rien à committer.'
            git reset
            exit 0
          fi
          git commit -m 'chore: update CAC 40 market data'
          git push

      # Les données récupérées sont déjà committées ci-dessus ; on signale
      # maintenant l'échec pour qu'un jeu de données muet ne passe pas inaperçu.
      - name: Report fetch failures
        if: steps.dividends.outcome == 'failure' || steps.prices.outcome == 'failure'
        run: |
          echo "Dividendes : ${{ steps.dividends.outcome }}"
          echo "Cours      : ${{ steps.prices.outcome }}"
          echo '::error::Une des synchronisations a échoué — voir les étapes ci-dessus.'
          exit 1
