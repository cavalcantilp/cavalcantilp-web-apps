name: Update CAC 40 market data

# Rafraîchit cours et dividendes une fois par jour. Les dividendes changent
# rarement et les cours quotidiennement : un passage par jour suffit.
on:
  # Planification suspendue : aucune source gratuite ne fonctionne encore
  # depuis un runner GitHub (voir scripts/lib/yahoo.mjs). La réactiver dès
  # qu'une source viable est retenue, sinon l'Action échoue tous les jours.
  # schedule:
  #   - cron: '0 5 * * *'
  workflow_dispatch: # lancement à la main uniquement, pour l'instant

# Nécessaire pour que l'Action puisse committer les données mises à jour.
permissions:
  contents: write

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Aucune clé : la source est publique. Un échec laisse les données
      # précédentes en place, l'app continue de fonctionner avec.
      - name: Fetch market data
        run: node scripts/fetch-market-data.mjs

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/cac40-dividends.json data/prices
          # generated_at change à chaque exécution : on ne committe que si les
          # données elles-mêmes ont bougé, pour ne pas polluer l'historique.
          if git diff --cached --quiet; then
            echo 'Aucun changement de données.'
            exit 0
          fi
          if git diff --cached -I'"generated_at"' --quiet; then
            echo 'Seul generated_at a changé — rien à committer.'
            git reset
            exit 0
          fi
          git commit -m 'chore: update CAC 40 market data'
          git push
