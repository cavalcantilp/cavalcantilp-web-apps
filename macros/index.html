<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur de Macros</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --input-bg: #334155;
      --border: #475569;
      --warning: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }

    .app-card { background: var(--card-bg); width: 100%; max-width: 420px; padding: 24px; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); border: 1px solid var(--border); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .back-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; transition: color 0.2s ease; }
    .back-link:hover { color: var(--accent-hover); }
    
    .lang-selector select {
      background: transparent;
      color: var(--text-sub);
      border: 1px solid var(--border);
      padding: 3px 6px;
      border-radius: 6px;
      cursor: pointer;
      outline: none;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      transition: all 0.2s ease;
    }
    .lang-selector select:hover {
      color: var(--text-main);
      border-color: var(--accent);
    }

    .header { margin-bottom: 20px; text-align: center; }
    .header h1 { font-size: 1.5rem; font-weight: 700; }
    .header p { color: var(--text-sub); font-size: 0.875rem; margin-top: 4px; }

    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }

    .form-group { margin-bottom: 16px; }
    .label-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    label { font-size: 0.8rem; font-weight: 600; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.05em; }
    .val-tag { font-size: 0.85rem; font-weight: 700; color: var(--accent); }

    input[type="number"] { width: 100%; padding: 12px 14px; background-color: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); font-size: 0.95rem; outline: none; transition: all 0.2s ease; -webkit-appearance: none; }
    input[type="number"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }

    input[type="range"] {
      width: 100%;
      height: 6px;
      background: var(--input-bg);
      border-radius: 3px;
      outline: none;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .result-box { margin-top: 20px; padding: 16px; background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 16px; text-align: center; }
    
    .macro-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 8px; }
    .macro-card { background: rgba(255, 255, 255, 0.03); padding: 10px 6px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.05); }
    .macro-title { font-size: 0.7rem; color: var(--text-sub); text-transform: uppercase; }
    .macro-value { font-size: 1.1rem; font-weight: 800; color: var(--text-main); margin: 2px 0; }
    .macro-sub { font-size: 0.75rem; color: var(--text-sub); }

    .warning-text { color: var(--warning); font-size: 0.75rem; margin-top: 10px; line-height: 1.2; display: none; }
    .warning-text.active { display: block; }

    .chart-container { position: relative; width: 100%; max-width: 220px; margin: 16px auto 0 auto; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="top-bar">
      <a href="/" class="back-link" data-i18n="back">← Accueil</a>
      <div class="lang-selector">
        <select id="langSelect" onchange="changeLang(this.value)">
          <option value="fr">FR</option>
          <option value="pt">PT</option>
        </select>
      </div>
    </div>

    <div class="header">
      <h1 data-i18n="title">Répartition Macros</h1>
      <p data-i18n="subtitle">Calculateur personnalisé</p>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="weight" data-i18n="weight">Poids (kg)</label>
        <input type="number" id="weight" value="70" min="30" max="250" oninput="calculate()">
      </div>
      <div class="form-group">
        <label for="calories" data-i18n="calories">Calories (kcal)</label>
        <input type="number" id="calories" value="2000" min="500" max="10000" oninput="calculate()">
      </div>
    </div>

    <div class="form-group">
      <div class="label-row">
        <label for="protein" data-i18n="protein">Protéines</label>
        <span class="val-tag" id="protVal">2.0 g/kg</span>
      </div>
      <input type="range" id="protein" min="1.6" max="2.2" step="0.1" value="2.0" oninput="calculate()">
    </div>

    <div class="form-group">
      <div class="label-row">
        <label for="fat" data-i18n="fat">Lipides</label>
        <span class="val-tag" id="fatVal">0.9 g/kg</span>
      </div>
      <input type="range" id="fat" min="0.8" max="1.0" step="0.1" value="0.9" oninput="calculate()">
    </div>

    <div class="result-box">
      <div class="macro-grid">
        <div class="macro-card">
          <div class="macro-title" data-i18n="lbl_prot">Protéines</div>
          <div class="macro-value" id="protGrams" style="color: #38bdf8;">0g</div>
          <div class="macro-sub" id="protKcal">0 kcal</div>
        </div>
        <div class="macro-card">
          <div class="macro-title" data-i18n="lbl_fat">Lipides</div>
          <div class="macro-value" id="fatGrams" style="color: #f59e0b;">0g</div>
          <div class="macro-sub" id="fatKcal">0 kcal</div>
        </div>
        <div class="macro-card">
          <div class="macro-title" data-i18n="lbl_carb">Glucides</div>
          <div class="macro-value" id="carbGrams" style="color: #34d399;">0g</div>
          <div class="macro-sub" id="carbKcal">0 kcal</div>
        </div>
      </div>

      <div class="warning-text" id="warningVal"></div>

      <div class="chart-container">
        <canvas id="macroChart"></canvas>
      </div>
    </div>
  </div>

  <script>
    const translations = {
      fr: {
        back: "← Accueil",
        title: "Répartition Macros",
        subtitle: "Calculateur personnalisé",
        weight: "Poids (kg)",
        calories: "Calories (kcal)",
        protein: "Protéines",
        fat: "Lipides",
        lbl_prot: "Protéines",
        lbl_fat: "Lipides",
        lbl_carb: "Glucides",
        txt_warn: "⚠️ L'objectif en calories est trop bas pour couvrir le total de protéines et lipides !"
      },
      pt: {
        back: "← Início",
        title: "Divisão de Macros",
        subtitle: "Calculadora personalizada",
        weight: "Peso (kg)",
        calories: "Calorias (kcal)",
        protein: "Proteínas",
        fat: "Gorduras",
        lbl_prot: "Proteínas",
        lbl_fat: "Gorduras",
        lbl_carb: "Carboidratos",
        txt_warn: "⚠️ A meta de calorias é muito baixa para cobrir as proteínas e gorduras!"
      }
    };

    let currentLang = 'fr';
    let chartInstance = null;

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });
      document.getElementById('langSelect').value = lang;
      localStorage.setItem('preferred_lang', lang);
      calculate();
    }

    function changeLang(lang) {
      setLanguage(lang);
    }

    // Récupérer les données issues du calculateur de calories ou de la session précédente
    function loadUserData() {
      const savedCaloriesData = localStorage.getItem('calories_user_data');
      const savedMacroData = localStorage.getItem('macros_user_data');

      // 1. Charger le poids sauvegardé dans l'outil calories
      if (savedCaloriesData) {
        const userData = JSON.parse(savedCaloriesData);
        if (userData.weight) {
          document.getElementById('weight').value = userData.weight;
        }
      }

      // 2. Charger les données spécifiques aux macros si elles existent
      if (savedMacroData) {
        const macroData = JSON.parse(savedMacroData);
        if (macroData.calories) document.getElementById('calories').value = macroData.calories;
        if (macroData.protein) document.getElementById('protein').value = macroData.protein;
        if (macroData.fat) document.getElementById('fat').value = macroData.fat;
      }
    }

    // Sauvegarder l'état actuel de l'outil macros
    function saveMacroData() {
      const macroData = {
        calories: document.getElementById('calories').value,
        protein: document.getElementById('protein').value,
        fat: document.getElementById('fat').value
      };
      localStorage.setItem('macros_user_data', JSON.stringify(macroData));

      // Mettre à jour le poids dans le stockage global s'il est modifié ici
      const savedCaloriesData = localStorage.getItem('calories_user_data');
      let userData = savedCaloriesData ? JSON.parse(savedCaloriesData) : {};
      userData.weight = document.getElementById('weight').value;
      localStorage.setItem('calories_user_data', JSON.stringify(userData));
    }

    function calculate() {
      const weight = parseFloat(document.getElementById('weight').value) || 0;
      const totalCalories = parseFloat(document.getElementById('calories').value) || 0;
      const protRatio = parseFloat(document.getElementById('protein').value);
      const fatRatio = parseFloat(document.getElementById('fat').value);

      document.getElementById('protVal').innerText = protRatio.toFixed(1) + " g/kg";
      document.getElementById('fatVal').innerText = fatRatio.toFixed(1) + " g/kg";

      // Calcul des grammes et calories
      const protGrams = weight * protRatio;
      const protKcal = protGrams * 4;

      const fatGrams = weight * fatRatio;
      const fatKcal = fatGrams * 9;

      const remainingKcal = totalCalories - (protKcal + fatKcal);
      const carbKcal = Math.max(0, remainingKcal);
      const carbGrams = carbKcal / 4;

      const warningEl = document.getElementById('warningVal');
      if (remainingKcal < 0) {
        warningEl.innerText = translations[currentLang].txt_warn;
        warningEl.classList.add('active');
      } else {
        warningEl.classList.remove('active');
      }

      document.getElementById('protGrams').innerText = Math.round(protGrams) + "g";
      document.getElementById('protKcal').innerText = Math.round(protKcal) + " kcal";

      document.getElementById('fatGrams').innerText = Math.round(fatGrams) + "g";
      document.getElementById('fatKcal').innerText = Math.round(fatKcal) + " kcal";

      document.getElementById('carbGrams').innerText = Math.round(carbGrams) + "g";
      document.getElementById('carbKcal').innerText = Math.round(carbKcal) + " kcal";

      saveMacroData();
      updateChart(protKcal, fatKcal, carbKcal);
    }

    function updateChart(protKcal, fatKcal, carbKcal) {
      const ctx = document.getElementById('macroChart').getContext('2d');
      const t = translations[currentLang];

      if (chartInstance) {
        chartInstance.destroy();
      }

      chartInstance = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: [t.lbl_prot, t.lbl_fat, t.lbl_carb],
          datasets: [{
            data: [protKcal, fatKcal, carbKcal],
            backgroundColor: ['#38bdf8', '#f59e0b', '#34d399'],
            borderWidth: 0
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: true,
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                color: '#94a3b8',
                font: { size: 11 },
                boxWidth: 12
              }
            }
          }
        }
      });
    }

    // Initialisation au chargement
    loadUserData();
    const savedLang = localStorage.getItem('preferred_lang') || (navigator.language.startsWith('pt') ? 'pt' : 'fr');
    setLanguage(savedLang);
  </script>
</body>
</html>
