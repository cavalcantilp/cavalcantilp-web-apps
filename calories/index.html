<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="/styles.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur Calories</title>
  <style>
    body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }

    .app-card { background: var(--card-bg); width: 100%; max-width: 420px; padding: 24px; border-radius: 24px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); border: 1px solid var(--border); }

    .header { margin-bottom: 20px; text-align: center; }
    .header h1 { font-size: 1.5rem; font-weight: 700; }
    .header p { color: var(--text-sub); font-size: 0.875rem; margin-top: 4px; }

    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
    input, select { width: 100%; padding: 12px 14px; background-color: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); font-size: 0.95rem; outline: none; transition: all 0.2s ease; -webkit-appearance: none; }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2); }

    .row { display: flex; gap: 12px; }
    .row .form-group { flex: 1; }

    button { width: 100%; padding: 14px; margin-top: 8px; background-color: var(--accent); color: #0f172a; border: none; border-radius: 12px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background-color 0.2s ease; }
    button:active { transform: scale(0.98); background-color: var(--accent-hover); }

    .result-box { margin-top: 20px; padding: 16px; background: rgba(56, 189, 248, 0.08); border: 1px solid rgba(56, 189, 248, 0.2); border-radius: 16px; text-align: center; display: none; }
    .result-box.active { display: block; }
    .result-title { font-size: 0.8rem; color: var(--text-sub); text-transform: uppercase; letter-spacing: 0.05em; }
    .result-value { font-size: 1.8rem; font-weight: 800; color: var(--accent); margin: 4px 0; }
    .result-sub { font-size: 0.85rem; color: var(--text-sub); margin-bottom: 4px; }
    .warning-text { color: var(--warning); font-size: 0.75rem; margin-top: 8px; line-height: 1.2; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="top-bar">
      <a href="/" class="back-link" data-i18n="back">← Accueil</a>
      <div class="lang-selector">
        <select id="langSelect" onchange="changeLang(this.value)">
          <option value="fr">FR</option>
          <option value="pt">PT</option>
        </select>
      </div>
    </div>

    <div class="header">
      <h1 data-i18n="title">Objectif Calories</h1>
      <p data-i18n="subtitle">Calculateur sur-mesure</p>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="height" data-i18n="height">Taille (cm)</label>
        <input type="number" id="height" placeholder="170">
      </div>
      <div class="form-group">
        <label for="weight" data-i18n="weight">Poids (kg)</label>
        <input type="number" id="weight" placeholder="70">
      </div>
    </div>

    <div class="row">
      <div class="form-group">
        <label for="age" data-i18n="age">Âge</label>
        <input type="number" id="age" placeholder="30">
      </div>
      <div class="form-group">
        <label for="gender" data-i18n="gender">Sexe</label>
        <select id="gender">
          <option value="male" data-i18n="male">Homme</option>
          <option value="female" data-i18n="female">Femme</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label for="activity" data-i18n="activity">Niveau d'activité</label>
      <select id="activity">
        <option value="1.2" data-i18n="act_sedentary">Sédentaire (bureau)</option>
        <option value="1.375" selected data-i18n="act_light">Léger (1-3x / semaine)</option>
        <option value="1.55" data-i18n="act_moderate">Modéré (3-5x / semaine)</option>
        <option value="1.725" data-i18n="act_active">Très actif (6-7x / semaine)</option>
      </select>
    </div>

    <div class="form-group">
      <label for="goal" data-i18n="goal">Objectif</label>
      <select id="goal">
        <option value="0.25" data-i18n="goal_loss_025">Perte : 0,25 kg / semaine (Léger)</option>
        <option value="0.5" selected data-i18n="goal_loss_050">Perte : 0,50 kg / semaine (Recommandé)</option>
        <option value="0.75" data-i18n="goal_loss_075">Perte : 0,75 kg / semaine (Soutenu)</option>
        <option value="1" data-i18n="goal_loss_100">Perte : 1,00 kg / semaine (Intense)</option>
        <option value="1.5" data-i18n="goal_loss_150">Perte : 1,50 kg / semaine (Agressif)</option>
        <option value="0" data-i18n="goal_maintain">Maintien du poids</option>
        <option value="-0.25" data-i18n="goal_gain_025">Prise : +0,25 kg / semaine (Léger)</option>
        <option value="-0.5" data-i18n="goal_gain_050">Prise : +0,50 kg / semaine (Recommandé)</option>
      </select>
    </div>

    <button onclick="calc()" data-i18n="btn_calc">Calculer l'objectif</button>

    <div class="result-box" id="resultBox">
      <div class="result-title" data-i18n="res_target">Apport quotidien cible</div>
      <div class="result-value" id="targetVal">0 kcal</div>
      <div class="result-sub" id="adjustmentVal"></div>
      <div class="result-sub" id="tdeeVal"></div>
      <div class="warning-text" id="warningVal"></div>
    </div>
  </div>

  <script>
    const translations = {
      fr: {
        back: "← Accueil",
        title: "Objectif Calories",
        subtitle: "Calculateur sur-mesure",
        height: "Taille (cm)",
        weight: "Poids (kg)",
        age: "Âge",
        gender: "Sexe",
        male: "Homme",
        female: "Femme",
        activity: "Niveau d'activité",
        act_sedentary: "Sédentaire (bureau)",
        act_light: "Léger (1-3x / semaine)",
        act_moderate: "Modéré (3-5x / semaine)",
        act_active: "Très actif (6-7x / semaine)",
        goal: "Objectif",
        goal_loss_025: "Perte : 0,25 kg / semaine (Léger)",
        goal_loss_050: "Perte : 0,50 kg / semaine (Recommandé)",
        goal_loss_075: "Perte : 0,75 kg / semaine (Soutenu)",
        goal_loss_100: "Perte : 1,00 kg / semaine (Intense)",
        goal_loss_150: "Perte : 1,50 kg / semaine (Agressif)",
        goal_maintain: "Maintien du poids",
        goal_gain_025: "Prise : +0,25 kg / semaine (Léger)",
        goal_gain_050: "Prise : +0,50 kg / semaine (Recommandé)",
        btn_calc: "Calculer l'objectif",
        res_target: "Apport quotidien cible",
        txt_deficit: "Déficit : -",
        txt_surplus: "Surplus : +",
        txt_no_change: "Ajustement : 0 kcal/jour",
        txt_day: " kcal/jour",
        txt_maint: "Maintien : ",
        txt_warn: "⚠️ Attention : cet objectif passe en dessous de votre métabolisme de base ("
      },
      pt: {
        back: "← Início",
        title: "Meta de Calorias",
        subtitle: "Calculadora personalizada",
        height: "Altura (cm)",
        weight: "Peso (kg)",
        age: "Idade",
        gender: "Sexo",
        male: "Homem",
        female: "Mulher",
        activity: "Nível de atividade",
        act_sedentary: "Sedentário (escritório)",
        act_light: "Leve (1-3x / semana)",
        act_moderate: "Moderado (3-5x / semana)",
        act_active: "Muito ativo (6-7x / semana)",
        goal: "Objetivo",
        goal_loss_025: "Perda: 0,25 kg / semana (Leve)",
        goal_loss_050: "Perda: 0,50 kg / semana (Recomendado)",
        goal_loss_075: "Perda: 0,75 kg / semana (Moderado)",
        goal_loss_100: "Perda: 1,00 kg / semana (Intenso)",
        goal_loss_150: "Perda: 1,50 kg / semana (Agressivo)",
        goal_maintain: "Manutenção do peso",
        goal_gain_025: "Ganho: +0,25 kg / semana (Leve)",
        goal_gain_050: "Ganho: +0,50 kg / semana (Recomendado)",
        btn_calc: "Calcular meta",
        res_target: "Meta diária de calorias",
        txt_deficit: "Déficit: -",
        txt_surplus: "Superávit: +",
        txt_no_change: "Ajuste: 0 kcal/dia",
        txt_day: " kcal/dia",
        txt_maint: "Manutenção: ",
        txt_warn: "⚠️ Atenção: esta meta está abaixo do seu metabolismo basal ("
      }
    };

    let currentLang = 'fr';

    function setLanguage(lang) {
      currentLang = lang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });
      document.getElementById('langSelect').value = lang;
      localStorage.setItem('preferred_lang', lang);
      
      if (document.getElementById('resultBox').classList.contains('active')) {
        calc();
      }
    }

    function changeLang(lang) {
      setLanguage(lang);
    }

    // Sauvegarder les données saisies par le visiteur
    function saveUserData() {
      const userData = {
        height: document.getElementById('height').value,
        weight: document.getElementById('weight').value,
        age: document.getElementById('age').value,
        gender: document.getElementById('gender').value,
        activity: document.getElementById('activity').value,
        goal: document.getElementById('goal').value
      };
      localStorage.setItem('calories_user_data', JSON.stringify(userData));
    }

    // Charger les dernières données sauvegardées ou mettre des valeurs par défaut
    function loadUserData() {
      const savedData = localStorage.getItem('calories_user_data');
      if (savedData) {
        const userData = JSON.parse(savedData);
        if (userData.height) document.getElementById('height').value = userData.height;
        if (userData.weight) document.getElementById('weight').value = userData.weight;
        if (userData.age) document.getElementById('age').value = userData.age;
        if (userData.gender) document.getElementById('gender').value = userData.gender;
        if (userData.activity) document.getElementById('activity').value = userData.activity;
        if (userData.goal) document.getElementById('goal').value = userData.goal;
      } else {
        // Valeurs neutres par défaut à la première visite
        document.getElementById('height').value = "170";
        document.getElementById('weight').value = "70";
        document.getElementById('age').value = "30";
      }
    }

    function calc() {
      const h = parseFloat(document.getElementById('height').value);
      const w = parseFloat(document.getElementById('weight').value);
      const a = parseFloat(document.getElementById('age').value);
      const gender = document.getElementById('gender').value;
      const act = parseFloat(document.getElementById('activity').value);
      const kgChange = parseFloat(document.getElementById('goal').value);

      if (!h || !w || !a) return;

      // Sauvegarder automatiquement les choix du visiteur à chaque calcul
      saveUserData();

      const bmr = (10 * w) + (6.25 * h) - (5 * a) + (gender === 'male' ? 5 : -161);
      const tdee = bmr * act;
      
      const dailyAdjustment = (kgChange * 7700) / 7;
      let target = tdee - dailyAdjustment;

      const t = translations[currentLang];
      
      let adjustmentText = "";
      if (kgChange > 0) {
        adjustmentText = t.txt_deficit + Math.round(dailyAdjustment) + t.txt_day;
      } else if (kgChange < 0) {
        adjustmentText = t.txt_surplus + Math.round(Math.abs(dailyAdjustment)) + t.txt_day;
      } else {
        adjustmentText = t.txt_no_change;
      }

      let warningMsg = "";
      if (kgChange > 0 && target < bmr) {
        warningMsg = t.txt_warn + Math.round(bmr) + " kcal).";
      }

      document.getElementById('targetVal').innerText = Math.round(target) + " kcal";
      document.getElementById('adjustmentVal').innerText = adjustmentText;
      document.getElementById('tdeeVal').innerText = t.txt_maint + Math.round(tdee) + t.txt_day;
      document.getElementById('warningVal').innerText = warningMsg;
      
      document.getElementById('resultBox').classList.add('active');
    }

    // Chargement initial
    loadUserData();
    const savedLang = localStorage.getItem('preferred_lang') || (navigator.language.startsWith('pt') ? 'pt' : 'fr');
    setLanguage(savedLang);
  </script>
</body>
</html>
