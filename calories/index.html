<!DOCTYPE html>
<html lang="fr">
<head>
  <link rel="manifest" href="manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculateur Calories</title>
  <style>
    :root {
      --bg: #0f172a; --card-bg: #1e293b; --accent: #38bdf8;
      --accent-hover: #0284c7; --text-main: #f8fafc;
      --text-sub: #94a3b8; --input-bg: #334155;
      --border: #475569; --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
    .app-card { background: var(--card-bg); width: 100%; max-width: 420px; padding: 24px; border-radius: 24px; border: 1px solid var(--border); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .back-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; font-weight: 600; }
    .lang-selector select { background: transparent; color: var(--text-sub); border: 1px solid var(--border); padding: 3px 6px; border-radius: 6px; cursor: pointer; font-size: 0.75rem; }
    .header { margin-bottom: 20px; text-align: center; }
    .header h1 { font-size: 1.5rem; font-weight: 700; }
    .form-group { margin-bottom: 14px; }
    label { display: block; font-size: 0.8rem; font-weight: 600; color: var(--text-sub); margin-bottom: 6px; text-transform: uppercase; }
    input, select { width: 100%; padding: 12px 14px; background-color: var(--input-bg); border: 1px solid var(--border); border-radius: 12px; color: var(--text-main); }
    button { width: 100%; padding: 14px; margin-top: 8px; background-color: var(--accent); color: #0f172a; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; }
    .result-box { margin-top: 20px; padding: 16px; background: rgba(56, 189, 248, 0.08); border-radius: 16px; text-align: center; display: none; }
    .result-box.active { display: block; }
    .result-value { font-size: 1.8rem; font-weight: 800; color: var(--accent); margin: 4px 0; }
    .warning-text { color: var(--warning); font-size: 0.75rem; margin-top: 8px; }
  </style>
</head>
<body>

  <div class="app-card">
    <div class="top-bar">
      <a href="/" class="back-link" data-i18n="back">← Accueil</a>
      <div class="lang-selector">
        <select id="langSelect" onchange="changeLang(this.value)">
          <option value="fr">FR</option><option value="pt">PT</option>
        </select>
      </div>
    </div>

    <div class="header">
      <h1 data-i18n="title">Objectif Calories</h1>
    </div>

    <!-- Champs inchangés -->
    <div class="row">
      <div class="form-group"><label data-i18n="height">Taille</label><input type="number" id="height" value="178"></div>
      <div class="form-group"><label data-i18n="weight">Poids</label><input type="number" id="weight" value="90"></div>
    </div>
    <div class="row">
      <div class="form-group"><label data-i18n="age">Âge</label><input type="number" id="age" value="30"></div>
      <div class="form-group"><label data-i18n="gender">Sexe</label><select id="gender"><option value="male" data-i18n="male">Homme</option><option value="female" data-i18n="female">Femme</option></select></div>
    </div>

    <div class="form-group">
      <label data-i18n="activity">Niveau d'activité</label>
      <select id="activity">
        <option value="1.2" data-i18n="act_sedentary">Sédentaire</option>
        <option value="1.375" selected data-i18n="act_light">Léger</option>
        <option value="1.55" data-i18n="act_moderate">Modéré</option>
      </select>
    </div>

    <div class="form-group">
      <label data-i18n="goal">Objectif</label>
      <select id="goal">
        <option value="0.5" data-i18n="loss_05">Perte 0,5kg / semaine</option>
        <option value="0" data-i18n="maintain">Maintien</option>
        <option value="-0.25" data-i18n="gain_025">Gain 0,25kg / semaine</option>
        <option value="-0.5" data-i18n="gain_05">Gain 0,5kg / semaine</option>
      </select>
    </div>

    <button onclick="calc()" data-i18n="btn_calc">Calculer</button>
    <div class="result-box" id="resultBox">
      <div class="result-value" id="targetVal">0 kcal</div>
      <div class="result-sub" id="statusVal"></div>
      <div class="warning-text" id="warningVal"></div>
    </div>
  </div>

  <script>
    const translations = {
      fr: { title: "Objectif Calories", height: "Taille (cm)", weight: "Poids (kg)", age: "Âge", gender: "Sexe", male: "Homme", female: "Femme", activity: "Activité", act_sedentary: "Sédentaire", act_light: "Léger", act_moderate: "Modéré", goal: "Objectif", loss_05: "Perte 0,5kg/sem", maintain: "Maintien", gain_025: "Gain 0,25kg/sem", gain_05: "Gain 0,5kg/sem", btn_calc: "Calculer", txt_maint: "Calories pour maintenir", txt_loss: "Cible pour perdre", txt_gain: "Cible pour gagner", warn: "⚠️ Attention : bas métabolisme." },
      pt: { title: "Meta de Calorias", height: "Altura (cm)", weight: "Peso (kg)", age: "Idade", gender: "Sexo", male: "Homem", female: "Mulher", activity: "Atividade", act_sedentary: "Sedentário", act_light: "Leve", act_moderate: "Moderado", goal: "Objetivo", loss_05: "Perda 0,5kg/sem", maintain: "Manutenção", gain_025: "Ganho 0,25kg/sem", gain_05: "Ganho 0,5kg/sem", btn_calc: "Calcular", txt_maint: "Calorias para manter", txt_loss: "Meta para perder", txt_gain: "Meta para ganhar", warn: "⚠️ Atenção: metabolismo baixo." }
    };

    function setLanguage(lang) {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) el.innerText = translations[lang][key];
      });
      document.getElementById('langSelect').value = lang;
      localStorage.setItem('preferred_lang', lang);
    }

    function calc() {
      const h = parseFloat(document.getElementById('height').value);
      const w = parseFloat(document.getElementById('weight').value);
      const a = parseFloat(document.getElementById('age').value);
      const act = parseFloat(document.getElementById('activity').value);
      const kgChange = parseFloat(document.getElementById('goal').value);
      const bmr = (10 * w) + (6.25 * h) - (5 * a) + (document.getElementById('gender').value === 'male' ? 5 : -161);
      const tdee = bmr * act;
      const adjustment = (kgChange * 7700) / 7;
      let target = tdee - adjustment;

      const lang = document.getElementById('langSelect').value;
      const t = translations[lang];
      document.getElementById('targetVal').innerText = Math.round(target) + " kcal";
      
      let statusText = t.txt_maint;
      if (kgChange > 0) statusText = t.txt_loss;
      if (kgChange < 0) statusText = t.txt_gain;
      
      document.getElementById('statusVal').innerText = statusText;
      document.getElementById('warningVal').innerText = (kgChange > 0 && target < bmr) ? t.warn : "";
      document.getElementById('resultBox').classList.add('active');
    }
    setLanguage(localStorage.getItem('preferred_lang') || 'fr');
  </script>
</body>
</html>
